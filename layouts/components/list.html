{{ define "storeOutputFormat" }}{{- .Store.Set "relearnOutputFormat" "HTML" }}{{ end }}
{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ partial "data_table_search.html" . }}
<table>
  <thead>
    <tr>
      <th>Component</th>
    </tr>
  </thead>
  <tbody>
    {{ range where site.RegularPages "Section" "components" }}
      <tr>
        <td><a href="{{ .RelPermalink }}">{{ .Title }}</a></td>
      </tr>
    {{ end }}
  </tbody>
</table>
{{ end }}
