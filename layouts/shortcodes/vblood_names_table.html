{{ $data := index site.Data.prefabs .Page.Params.data_file }}
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Prefab GUID</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody>
    {{ range $data }}
    <tr>
      <td>{{ index . 0 }}</td>
      <td>{{ index . 1 }}</td>
      <td>{{ index . 2 }}</td>
    </tr>
    {{ end }}
  </tbody>
</table>
