---
layout: default
parent: Prefabs
nav_exclude: false
search_exclude: false
---

<h1>{{ page.title }} Prefabs</h1>

{% assign prefab_data = site.data.prefabs[page.data_file] %}

{% include data_table_search.html %}
{{ content}}
<table>
  <thead>
    <tr>
      <th>Prefab</th>
      <th>Id</th>
    </tr>
  </thead>
  <tbody>
    {% for row in prefab_data %}
      <tr>
        <td><a href="{{ '/prefabs/details/' | append: row[0] | relative_url }}">{{ row[0] }}</a></td>
        <td>{{ row[1] }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
