name: Jekyll Build and Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI and jq (for artifact restore)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gh jq

      - name: Restore previous built-site artifact (run #7)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e  # allow fall‑through if artifact is missing
          echo "Attempting to download built-site artifact from run #7 …"
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs/7/artifacts > artifacts.json
          artifact_url=$(jq -r '.artifacts[] | select(.name=="built-site") | .archive_download_url' artifacts.json)
          if [ -z "$artifact_url" ]; then
            echo "No previous built-site artifact found. Continuing with clean build."
            exit 0
          fi
          curl -L -H "Authorization: token $GH_TOKEN" "$artifact_url" -o built-site.zip
          mkdir artifact-restore
          unzip -q built-site.zip -d artifact-restore
          # Normalize to _site/ destination for Jekyll
          if [ -d artifact-restore/_site ]; then
            mv artifact-restore/_site ./_site
          else
            mv artifact-restore ./_site
          fi
          echo "Previous build restored to _site/."
          set -e

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll (full build)
        run: bundle exec jekyll build --verbose --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload built-site artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          retention-days: 14
          compression-level: 6

      - name: Upload artifact for Pages deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
